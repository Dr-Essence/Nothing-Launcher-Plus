plugins {
    id 'com.android.application'
}

android {
    namespace 'com.dressence.nothinglauncherplus'
    compileSdk 36

    defaultConfig {
        applicationId 'com.dressence.nothinglauncherplus'
        minSdk 31
        targetSdk 36
        versionCode 3
        versionName '0.3.0'
    }

    // Updates must always be signed with the same key, otherwise Android refuses to install them
    // over the previous version (and uninstalling first wipes the saved folders). The release key
    // lives outside the repo: CI decodes it from secrets, local builds point at it via env vars.
    def releaseKeystore = System.getenv('SIGNING_KEYSTORE')
    signingConfigs {
        release {
            if (releaseKeystore) {
                storeFile file(releaseKeystore)
                storePassword System.getenv('SIGNING_PASSWORD')
                keyAlias System.getenv('SIGNING_KEY_ALIAS') ?: 'nlplus'
                keyPassword System.getenv('SIGNING_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            // Hook code resolves launcher classes by name/reflection; keep it unobfuscated.
            minifyEnabled false
            signingConfig releaseKeystore ? signingConfigs.release : signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    compileOnly 'de.robv.android.xposed:api:82'
}
