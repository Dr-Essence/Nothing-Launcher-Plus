plugins {
    id 'com.android.application'
}

android {
    namespace 'com.dressence.nothinglauncherplus'
    compileSdk 36

    defaultConfig {
        applicationId 'com.dressence.nothinglauncherplus'
        minSdk 31
        targetSdk 36
        versionCode 1
        versionName '0.1.0'
    }

    buildTypes {
        release {
            // Hook code resolves launcher classes by name/reflection; keep it unobfuscated.
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    compileOnly 'de.robv.android.xposed:api:82'
}
