plugins {
    id 'com.android.application'
}

android {
    namespace 'com.dressence.nothinglauncherplus'
    compileSdk 36

    defaultConfig {
        applicationId 'com.dressence.nothinglauncherplus'
        minSdk 31
        targetSdk 36
        versionCode 40
        versionName '0.15.4'
    }

    // Every build is signed with the same key so updates install over each other and keep the
    // saved folders. The key is committed on purpose (signing/update.jks): it only identifies this
    // module's builds and protects nothing else. SIGNING_KEYSTORE / SIGNING_PASSWORD /
    // SIGNING_KEY_ALIAS can point at a private key instead.
    def keystore = System.getenv('SIGNING_KEYSTORE') ?: rootProject.file('signing/update.jks').path
    def password = System.getenv('SIGNING_PASSWORD') ?: 'nlplus-update'
    signingConfigs {
        update {
            storeFile file(keystore)
            storePassword password
            keyAlias System.getenv('SIGNING_KEY_ALIAS') ?: 'nlplus'
            keyPassword password
        }
    }

    buildTypes {
        release {
            // Hook code resolves launcher classes by name/reflection; keep it unobfuscated.
            minifyEnabled false
            signingConfig signingConfigs.update
        }
        debug {
            signingConfig signingConfigs.update
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    compileOnly 'de.robv.android.xposed:api:82'
}
