plugins {
    id 'com.android.application'
}

android {
    namespace 'com.dressence.nothinglauncherplus'
    compileSdk 36

    defaultConfig {
        applicationId 'com.dressence.nothinglauncherplus'
        minSdk 31
        targetSdk 36
        versionCode 227
        versionName '0.52.5'
    }

    // Every release build is signed with one private key, so updates install over each other
    // and keep the saved folders. CI writes it from the repository secrets (SIGNING_KEYSTORE_B64,
    // SIGNING_PASSWORD, SIGNING_KEY_ALIAS) and passes its path as SIGNING_KEYSTORE. Without it
    // (a local build, a fork) the build is debug-signed and cannot update an installed release.
    // The key is not in the repository: an APK signed with a public key would install as an
    // update and inherit the module's LSPosed scope.
    def keystore = System.getenv('SIGNING_KEYSTORE')
    def password = System.getenv('SIGNING_PASSWORD')
    signingConfigs {
        if (keystore && file(keystore).exists()) {
            update {
                storeFile file(keystore)
                storePassword password
                keyAlias System.getenv('SIGNING_KEY_ALIAS') ?: 'nlplus'
                keyPassword password
            }
        }
    }

    buildTypes {
        release {
            // Hook code resolves launcher classes by name/reflection; keep it unobfuscated.
            minifyEnabled false
            signingConfig signingConfigs.findByName('update') ?: signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    compileOnly 'de.robv.android.xposed:api:82'
}
