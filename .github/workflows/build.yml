name: Build module

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      # The runner image ships the Android SDK; ANDROID_HOME is already set. Signing uses the
      # committed update key (signing/update.jks), so every build updates the previous one.
      - name: Build APK
        run: ./gradlew --no-daemon assembleRelease

      - uses: actions/upload-artifact@v5
        with:
          name: NothingLauncherPlus
          path: app/build/outputs/apk/release/*.apk
